[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pnms-ieeg"
version = "0.1.0"
description = "Person-specific EEG memory decoders tested against a non-neural model (PEERS ltpFR)"
requires-python = ">=3.11"
dependencies = [
  "mne==1.13.2", "mne-bids==0.20.0", "edfio==0.4.18", "numpy==2.5.4", "scipy==1.18.1",
  "pandas==3.0.6", "scikit-learn==1.9.1", "statsmodels==0.15.0", "matplotlib==3.11.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
